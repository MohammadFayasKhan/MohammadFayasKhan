<svg viewBox="0 0 1000 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profile metrics and repository languages">
<style>
:root{--bone:#444444;--muted:#888888;--dim:#AAAAAA;--rule:#C0C0C0;--accent:#555555;--node:#F0F0F0;--core:#E8E8E8}
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:var(--node);stroke:var(--rule);stroke-width:1}
.soft{fill:var(--core);stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule);stroke-width:1;opacity:.32}
.bar{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)}
.rise{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.1s}.r2{animation-delay:.2s}.r3{animation-delay:.3s}.r4{animation-delay:.4s}.r5{animation-delay:.5s}.r6{animation-delay:.6s}.r7{animation-delay:.7s}.r8{animation-delay:.8s}.r9{animation-delay:.9s}.r10{animation-delay:1s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.wire{stroke:var(--rule);stroke-width:1;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-origin:60px 64px}
.blink{animation:blink 1.1s steps(2,end) infinite}
.scan{animation:scan 4s ease-in-out infinite}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:.15}50%{opacity:.8}100%{transform:translateX(900px);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.rise,.draw,.wire,.pulse,.ring,.blink,.scan,.float{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<title>Profile metrics and repository languages</title>
<g><rect x="24" y="20" width="456" height="270" fill="none" stroke="var(--rule)"/><rect x="520" y="20" width="456" height="270" fill="none" stroke="var(--rule)"/><text x="52" y="58" font-size="15" fill="var(--bone)" font-weight="700" letter-spacing="2" class="mono r1">PROFILE METRICS</text><text x="52" y="96" font-size="11" fill="var(--muted)" letter-spacing="1" class="mono r2">LATEST RECORDED TGPA</text><text x="452" y="98" font-size="18" fill="var(--accent)" font-weight="700" text-anchor="end" class="mono r2">9.76</text><text x="52" y="136" font-size="11" fill="var(--muted)" letter-spacing="1" class="mono r3">CSE RANK IN TGPA</text><text x="452" y="138" font-size="18" fill="var(--accent)" font-weight="700" text-anchor="end" class="mono r3">14TH</text><text x="52" y="176" font-size="11" fill="var(--muted)" letter-spacing="1" class="mono r4">GRADUATION TARGET</text><text x="452" y="178" font-size="18" fill="var(--accent)" font-weight="700" text-anchor="end" class="mono r4">2028</text><text x="52" y="226" font-size="11" fill="var(--muted)" letter-spacing="1" class="mono r5">GITHUB ACCOUNT</text><text x="52" y="252" font-size="15" fill="var(--bone)" font-weight="700" class="mono r5">MohammadFayasKhan</text><text x="548" y="58" font-size="15" fill="var(--bone)" font-weight="700" letter-spacing="2" class="mono r6">LANGUAGES / ACTIVITY</text><text x="548" y="104" font-size="12" fill="var(--accent)" font-weight="700" class="mono r7">LIVE PROFILE GRAPH BELOW</text><text x="548" y="140" font-size="13" fill="var(--bone)" class="mono r8">Repository language views and contribution</text><text x="548" y="164" font-size="13" fill="var(--bone)" class="mono r8">activity use the GitHub account directly.</text><text x="548" y="212" font-size="12" fill="var(--muted)" class="mono r9">No hardcoded stars, streaks or solve counts.</text></g>
</svg>