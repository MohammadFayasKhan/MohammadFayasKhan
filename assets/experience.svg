<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience, leadership and education">
<style>
:root{--bone:#444444;--muted:#888888;--dim:#AAAAAA;--rule:#C0C0C0;--accent:#555555;--node:#F0F0F0;--core:#E8E8E8}
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:var(--node);stroke:var(--rule);stroke-width:1}
.soft{fill:var(--core);stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule);stroke-width:1;opacity:.32}
.bar{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)}
.rise{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.1s}.r2{animation-delay:.2s}.r3{animation-delay:.3s}.r4{animation-delay:.4s}.r5{animation-delay:.5s}.r6{animation-delay:.6s}.r7{animation-delay:.7s}.r8{animation-delay:.8s}.r9{animation-delay:.9s}.r10{animation-delay:1s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.wire{stroke:var(--rule);stroke-width:1;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-origin:60px 64px}
.blink{animation:blink 1.1s steps(2,end) infinite}
.scan{animation:scan 4s ease-in-out infinite}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:.15}50%{opacity:.8}100%{transform:translateX(900px);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.rise,.draw,.wire,.pulse,.ring,.blink,.scan,.float{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<title>Experience, leadership and education</title>
<g><line x1="120" y1="10" x2="120" y2="360" stroke="var(--rule)" opacity=".4"/><text x="48" y="42" font-size="12" fill="var(--accent)" letter-spacing="2" class="mono r1">2026</text><text x="136" y="42" font-size="15" fill="var(--bone)" class="mono r1">TEAM INNOVEX · TECHNICAL TEAM LEAD</text><text x="136" y="68" font-size="13" fill="var(--muted)" class="mono r1">AI, IoT and hardware-oriented development for hackathon systems.</text><text x="136" y="92" font-size="12" fill="var(--bone)" class="mono r1">LPU GearUp Season 5 selection · SIH26180 preparation.</text><text x="48" y="142" font-size="12" fill="var(--accent)" letter-spacing="2" class="mono r2">2026</text><text x="136" y="142" font-size="15" fill="var(--bone)" class="mono r2">PROJECT ENGINEERING · APPLIED AI</text><text x="136" y="168" font-size="13" fill="var(--muted)" class="mono r2">AgriRover, LPU Agent and CodeExplain connect models to usable systems.</text><text x="136" y="192" font-size="12" fill="var(--bone)" class="mono r2">FastAPI · Playwright · React · computer vision · local-first architecture.</text><text x="48" y="242" font-size="12" fill="var(--accent)" letter-spacing="2" class="mono r3">2024 →</text><text x="136" y="242" font-size="15" fill="var(--bone)" class="mono r3">LPU · B.TECH COMPUTER SCIENCE AND ENGINEERING</text><text x="136" y="268" font-size="13" fill="var(--muted)" class="mono r3">Latest TGPA 9.76 · CSE rank 14th in TGPA · graduation target 2028.</text><text x="136" y="292" font-size="12" fill="var(--bone)" class="mono r3">Class Representative during third semester · Team Innovex collaboration.</text></g>
</svg>