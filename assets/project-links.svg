<svg viewBox="0 0 1000 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project links and engineering decisions">
<style>
:root{--bone:#444444;--muted:#888888;--dim:#AAAAAA;--rule:#C0C0C0;--accent:#555555;--node:#F0F0F0;--core:#E8E8E8}
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:var(--node);stroke:var(--rule);stroke-width:1}
.soft{fill:var(--core);stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule);stroke-width:1;opacity:.32}
.bar{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)}
.rise{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.1s}.r2{animation-delay:.2s}.r3{animation-delay:.3s}.r4{animation-delay:.4s}.r5{animation-delay:.5s}.r6{animation-delay:.6s}.r7{animation-delay:.7s}.r8{animation-delay:.8s}.r9{animation-delay:.9s}.r10{animation-delay:1s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.wire{stroke:var(--rule);stroke-width:1;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-origin:60px 64px}
.blink{animation:blink 1.1s steps(2,end) infinite}
.scan{animation:scan 4s ease-in-out infinite}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:.15}50%{opacity:.8}100%{transform:translateX(900px);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.rise,.draw,.wire,.pulse,.ring,.blink,.scan,.float{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<title>Project links and engineering decisions</title>
<g><text x="48" y="34" font-size="11" fill="var(--muted)" letter-spacing="3" class="mono">PROJECT LINKS</text><text x="952" y="34" font-size="11" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono">REPOSITORIES / DECISIONS / STATUS</text><line class="draw" x1="48" y1="52" x2="952" y2="52"/><text x="48" y="82" font-size="10" fill="var(--muted)" letter-spacing="2" class="mono">SYSTEM</text><text x="390" y="82" font-size="10" fill="var(--muted)" letter-spacing="2" class="mono">PROOF / DECISION</text><text x="952" y="82" font-size="10" fill="var(--muted)" text-anchor="end" letter-spacing="2" class="mono">SURFACE</text><rect class="rise r1" x="48" y="95" width="904" height="30" fill="var(--node)" opacity=".55"/><text x="48" y="114" font-size="11" fill="var(--bone)" class="mono r1">AGRIROVER</text><text x="390" y="114" font-size="11" fill="var(--muted)" class="mono r1">lab vs field evaluation · proposed edge pipeline</text><text x="952" y="114" font-size="10" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono r1">REPO</text><rect class="rise r2" x="48" y="137" width="904" height="30" fill="var(--node)" opacity=".55"/><text x="48" y="156" font-size="11" fill="var(--bone)" class="mono r2">LPU AGENT</text><text x="390" y="156" font-size="11" fill="var(--muted)" class="mono r2">manual auth · local-first persistence · WIP</text><text x="952" y="156" font-size="10" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono r2">REPO</text><rect class="rise r3" x="48" y="179" width="904" height="30" fill="var(--node)" opacity=".55"/><text x="48" y="198" font-size="11" fill="var(--bone)" class="mono r3">CODEEXPLAIN</text><text x="390" y="198" font-size="11" fill="var(--muted)" class="mono r3">education · validated API contracts · Render</text><text x="952" y="198" font-size="10" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono r3">REPO</text><rect class="rise r4" x="48" y="221" width="904" height="30" fill="var(--node)" opacity=".55"/><text x="48" y="240" font-size="11" fill="var(--bone)" class="mono r4">FAYASAI</text><text x="390" y="240" font-size="11" fill="var(--muted)" class="mono r4">embedded voice loop · OLED interface · WIP</text><text x="952" y="240" font-size="10" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono r4">REPO</text><rect class="rise r5" x="48" y="263" width="904" height="30" fill="var(--node)" opacity=".55"/><text x="48" y="282" font-size="11" fill="var(--bone)" class="mono r5">CPUSCHED</text><text x="390" y="282" font-size="11" fill="var(--muted)" class="mono r5">algorithm visualisation · team build</text><text x="952" y="282" font-size="10" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono r5">REPO</text><rect class="rise r6" x="48" y="305" width="904" height="30" fill="var(--node)" opacity=".55"/><text x="48" y="324" font-size="11" fill="var(--bone)" class="mono r6">ESPBOT</text><text x="390" y="324" font-size="11" fill="var(--muted)" class="mono r6">Wi-Fi robotics · browser controls</text><text x="952" y="324" font-size="10" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono r6">REPO</text><rect class="rise r7" x="48" y="347" width="904" height="30" fill="var(--node)" opacity=".55"/><text x="48" y="366" font-size="11" fill="var(--bone)" class="mono r7">JOY MOUSE</text><text x="390" y="366" font-size="11" fill="var(--muted)" class="mono r7">serial input · filtering · acceleration</text><text x="952" y="366" font-size="10" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono r7">REPO</text><rect class="rise r8" x="48" y="389" width="904" height="30" fill="var(--node)" opacity=".55"/><text x="48" y="408" font-size="11" fill="var(--bone)" class="mono r8">SMART HOME</text><text x="390" y="408" font-size="11" fill="var(--muted)" class="mono r8">on-device HAP · active-LOW relay safety</text><text x="952" y="408" font-size="10" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono r8">REPO</text><line class="draw" x1="48" y1="462" x2="952" y2="462"/><text x="48" y="492" font-size="10" fill="var(--muted)" letter-spacing="2" class="mono r8">ENGINEERING DECISIONS</text><text x="48" y="518" font-size="12" fill="var(--bone)" class="mono r8">transparent evaluation · deterministic rules · validated contracts · local-first privacy</text><text x="48" y="542" font-size="12" fill="var(--muted)" class="mono r9">sensor-measurable features · user-controlled auth · observable interfaces</text></g>
