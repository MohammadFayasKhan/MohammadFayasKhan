<svg viewBox="0 0 1000 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack, current focus, and next build">
  <style>:root{--bone:#444;--muted:#888;--rule:#c0c0c0;--accent:#555;--panel:#fff}@media(prefers-color-scheme:dark){:root{--bone:#ddd;--muted:#888;--rule:#444;--accent:#aaa;--panel:#111}}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.rise{opacity:0;animation:rise .6s ease forwards}.a1{animation-delay:.15s}.a2{animation-delay:.3s}.a3{animation-delay:.45s}.a4{animation-delay:.6s}.a5{animation-delay:.75s}.a6{animation-delay:.9s}@keyframes rise{to{opacity:1}}@media(prefers-reduced-motion:reduce){.rise{animation:none;opacity:1}}</style>
  <rect width="1000" height="430" fill="var(--panel)" stroke="var(--rule)"/>
  <text class="mono" x="48" y="34" font-size="11" letter-spacing="3.5" fill="var(--muted)">STACK · CURRENT FOCUS · NEXT BUILD</text><line x1="48" y1="52" x2="952" y2="52" stroke="var(--rule)"/>
  <g class="mono rise a1" font-size="12"><text x="48" y="84" fill="var(--muted)">LANGUAGES</text><text x="220" y="84" fill="var(--bone)">C++ · PYTHON · C · JAVA · JAVASCRIPT · TYPESCRIPT · SQL</text></g>
  <g class="mono rise a2" font-size="12"><text x="48" y="120" fill="var(--muted)">AI / ML</text><text x="220" y="120" fill="var(--bone)">PYTORCH · SCIKIT-LEARN · OPENCV · YOLO · EFFICIENTNETV2-S · DLIB</text></g>
  <g class="mono rise a3" font-size="12"><text x="48" y="156" fill="var(--muted)">LLM SYSTEMS</text><text x="220" y="156" fill="var(--bone)">LANGCHAIN · LANGGRAPH · RAG · TOOL CALLING · GUARDRAILS · LORA/QLORA</text></g>
  <g class="mono rise a4" font-size="12"><text x="48" y="192" fill="var(--muted)">PRODUCT</text><text x="220" y="192" fill="var(--bone)">REACT · VITE · TAILWIND · FASTAPI · PYDANTIC · NODE · CHROME MV3</text></g>
  <g class="mono rise a5" font-size="12"><text x="48" y="228" fill="var(--muted)">INFRASTRUCTURE</text><text x="220" y="228" fill="var(--bone)">POSTGRESQL · MYSQL · SQLITE · FIREBASE · DOCKER · LINUX · VERCEL · RENDER</text></g>
  <g class="mono rise a6" font-size="12"><text x="48" y="264" fill="var(--muted)">HARDWARE</text><text x="220" y="264" fill="var(--bone)">ESP32 · ESP32-CAM · ESP8266 · ARDUINO · BLYNK · DHT11 · FIELD SENSORS</text></g>
  <line x1="48" y1="292" x2="952" y2="292" stroke="var(--rule)"/>
  <text class="mono" x="48" y="322" font-size="11" fill="var(--muted)">CURRENT FOCUS</text><text class="mono" x="260" y="322" font-size="12" fill="var(--bone)">C++ DSA · STRIVER A2Z · 25-MINUTE COLD SOLVES · 200+ TARGET</text>
  <text class="mono" x="48" y="354" font-size="11" fill="var(--muted)">NEXT BUILD</text><text class="mono" x="260" y="354" font-size="12" fill="var(--accent)">PRODUCTION-READY AI SYSTEMS WITH DETERMINISTIC GUARDRAILS</text>
  <text class="mono" x="48" y="398" font-size="11" fill="var(--muted)">BUILDING</text><text class="mono" x="260" y="398" font-size="12" fill="var(--bone)">CROP ROVER · AGENTIC TOOLS · GSSOC CONTRIBUTIONS</text>
</svg>
