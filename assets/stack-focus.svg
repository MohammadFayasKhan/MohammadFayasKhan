<svg viewBox="0 0 1000 570" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack, current focus, and next build">
  <style>:root{--ink:#444;--muted:#888;--rule:#c0c0c0;--accent:#555;--paper:#fff}@media(prefers-color-scheme:dark){:root{--ink:#ddd;--muted:#888;--rule:#444;--accent:#aaa;--paper:#111}}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.rise{opacity:0;animation:rise .55s ease forwards}@keyframes rise{to{opacity:1}}.a1{animation-delay:.1s}.a2{animation-delay:.2s}.a3{animation-delay:.3s}.a4{animation-delay:.4s}.a5{animation-delay:.5s}.a6{animation-delay:.6s}@media(prefers-reduced-motion:reduce){.rise{animation:none;opacity:1}}</style>
