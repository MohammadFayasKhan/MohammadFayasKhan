<svg viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Academic and technical development route">
<style>
:root{--bone:#DDDDDD;--muted:#777777;--dim:#666666;--rule:#444444;--accent:#AAAAAA;--node:#1A1A1A;--core:#222222}
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:var(--node);stroke:var(--rule);stroke-width:1}
.soft{fill:var(--core);stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule);stroke-width:1;opacity:.32}
.bar{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)}
.rise{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.1s}.r2{animation-delay:.2s}.r3{animation-delay:.3s}.r4{animation-delay:.4s}.r5{animation-delay:.5s}.r6{animation-delay:.6s}.r7{animation-delay:.7s}.r8{animation-delay:.8s}.r9{animation-delay:.9s}.r10{animation-delay:1s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.wire{stroke:var(--rule);stroke-width:1;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-origin:60px 64px}
.blink{animation:blink 1.1s steps(2,end) infinite}
.scan{animation:scan 4s ease-in-out infinite}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:.15}50%{opacity:.8}100%{transform:translateX(900px);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.rise,.draw,.wire,.pulse,.ring,.blink,.scan,.float{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<title>Academic and technical development route</title>
<g><line class="draw" x1="70" y1="126" x2="1130" y2="126"/><text x="70" y="52" font-size="12" fill="var(--accent)" class="mono r1">2024</text><text x="70" y="82" font-size="13" fill="var(--bone)" font-weight="700" class="mono r1">LPU BEGINS</text><text x="70" y="170" font-size="11" fill="var(--muted)" class="mono r1">B.Tech CSE · foundations</text><text x="270" y="52" font-size="12" fill="var(--accent)" class="mono r2">2025</text><text x="270" y="82" font-size="13" fill="var(--bone)" font-weight="700" class="mono r2">SYSTEMS</text><text x="270" y="170" font-size="11" fill="var(--muted)" class="mono r2">IoT · web · ML projects</text><text x="490" y="52" font-size="12" fill="var(--accent)" class="mono r3">2026</text><text x="490" y="82" font-size="13" fill="var(--bone)" font-weight="700" class="mono r3">TEAM INNOVEX</text><text x="490" y="170" font-size="11" fill="var(--muted)" class="mono r3">GearUp selection · SIH work</text><text x="710" y="52" font-size="12" fill="var(--accent)" class="mono r4">2026</text><text x="710" y="82" font-size="13" fill="var(--bone)" font-weight="700" class="mono r4">AI SYSTEMS</text><text x="710" y="170" font-size="11" fill="var(--muted)" class="mono r4">AgriRover · LPU Agent · CodeExplain</text><text x="930" y="52" font-size="12" fill="var(--accent)" class="mono r5">NOW</text><text x="930" y="82" font-size="13" fill="var(--bone)" font-weight="700" class="mono r5">NEXT ITERATION</text><text x="930" y="170" font-size="11" fill="var(--muted)" class="mono r5">C++ DSA · backend · AI engineering</text><circle class="rise r5" cx="70" cy="126" r="5" fill="var(--accent)"/><circle class="rise r5" cx="270" cy="126" r="5" fill="var(--accent)"/><circle class="rise r5" cx="490" cy="126" r="5" fill="var(--accent)"/><circle class="rise r5" cx="710" cy="126" r="5" fill="var(--accent)"/><circle class="rise r5" cx="930" cy="126" r="5" fill="var(--accent)"/><circle class="ring" style="transform-origin:930px 126px" cx="930" cy="126" r="10" stroke="var(--accent)" fill="none"/></g>
</svg>