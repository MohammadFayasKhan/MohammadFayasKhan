<svg viewBox="0 0 1000 410" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Credentials, leadership and academic record">
<style>
:root{--bone:#DDDDDD;--muted:#777777;--dim:#666666;--rule:#444444;--accent:#AAAAAA;--node:#1A1A1A;--core:#222222}
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:var(--node);stroke:var(--rule);stroke-width:1}
.soft{fill:var(--core);stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule);stroke-width:1;opacity:.32}
.bar{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)}
.rise{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.1s}.r2{animation-delay:.2s}.r3{animation-delay:.3s}.r4{animation-delay:.4s}.r5{animation-delay:.5s}.r6{animation-delay:.6s}.r7{animation-delay:.7s}.r8{animation-delay:.8s}.r9{animation-delay:.9s}.r10{animation-delay:1s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.wire{stroke:var(--rule);stroke-width:1;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-origin:60px 64px}
.blink{animation:blink 1.1s steps(2,end) infinite}
.scan{animation:scan 4s ease-in-out infinite}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:.15}50%{opacity:.8}100%{transform:translateX(900px);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.rise,.draw,.wire,.pulse,.ring,.blink,.scan,.float{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<title>Credentials, leadership and academic record</title>
<g><text x="48" y="34" font-size="11" fill="var(--muted)" letter-spacing="3" class="mono">CREDENTIALS</text><text x="952" y="34" font-size="11" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono">LEADERSHIP / ACADEMIC RECORD / CERTIFICATIONS</text><line class="draw" x1="48" y1="52" x2="952" y2="52"/><text x="48" y="84" font-size="11" fill="var(--muted)" letter-spacing="2" class="mono r1">ACADEMIC RECORD</text><text x="48" y="112" font-size="15" fill="var(--bone)" font-weight="700" class="mono r1">TGPA 9.76 · CSE RANK 14TH · GRADUATING 2028</text><text x="48" y="138" font-size="11" fill="var(--muted)" class="mono r1">AI/ML MINOR · &gt;95% IN CLASS 10 AND CLASS 12 · INSPIRE MANAK TWICE</text><line class="draw" x1="48" y1="162" x2="952" y2="162"/><text x="48" y="194" font-size="11" fill="var(--muted)" letter-spacing="2" class="mono r2">LEADERSHIP AND SELECTION</text><text x="48" y="222" font-size="14" fill="var(--bone)" font-weight="700" class="mono r2">TEAM INNOVEX LEAD · LPU GEARUP SEASON 5</text><text x="48" y="246" font-size="12" fill="var(--muted)" class="mono r2">SELECTED AMONG 30 HARDWARE TEAMS FROM 900+ PARTICIPATING TEAMS</text><line class="draw" x1="48" y1="270" x2="952" y2="270"/><text x="48" y="302" font-size="11" fill="var(--muted)" letter-spacing="2" class="mono r3">CERTIFICATIONS</text><text x="48" y="330" font-size="14" fill="var(--bone)" font-weight="700" class="mono r3">IBM SKILLSBUILD · HP LIFE · AGILE ACADEMY</text><text x="48" y="354" font-size="11" fill="var(--muted)" class="mono r3">AGILE EXPLORER · PROJECT MANAGEMENT · AGILE FUNDAMENTALS · SCRUM FOUNDATIONS</text><text x="48" y="378" font-size="10" fill="var(--accent)" letter-spacing="1" class="mono r3">30 AUG · 8 SEP · 30 SEP · 1 OCT 2026</text></g>
</svg>