<svg viewBox="0 0 1000 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map — AI, software and hardware ecosystem">
<style>
:root{--bone:#DDDDDD;--muted:#777777;--dim:#666666;--rule:#444444;--accent:#AAAAAA;--node:#1A1A1A;--core:#222222}
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:var(--node);stroke:var(--rule);stroke-width:1}
.soft{fill:var(--core);stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule);stroke-width:1;opacity:.32}
.bar{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)}
.rise{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.1s}.r2{animation-delay:.2s}.r3{animation-delay:.3s}.r4{animation-delay:.4s}.r5{animation-delay:.5s}.r6{animation-delay:.6s}.r7{animation-delay:.7s}.r8{animation-delay:.8s}.r9{animation-delay:.9s}.r10{animation-delay:1s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.wire{stroke:var(--rule);stroke-width:1;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-origin:60px 64px}
.blink{animation:blink 1.1s steps(2,end) infinite}
.scan{animation:scan 4s ease-in-out infinite}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:.15}50%{opacity:.8}100%{transform:translateX(900px);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.rise,.draw,.wire,.pulse,.ring,.blink,.scan,.float{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<title>System map — AI, software and hardware ecosystem</title>
<g><text x="48" y="34" font-size="11" fill="var(--muted)" letter-spacing="3" class="mono">SYSTEM MAP</text><text x="952" y="34" font-size="11" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono">ONE PIPELINE / MANY LAYERS</text><line class="draw" x1="48" y1="52" x2="952" y2="52"/><text x="48" y="84" font-size="16" fill="var(--bone)" font-weight="700" letter-spacing="2" class="mono r1">FAYAS.SYS</text><text x="48" y="108" font-size="12" fill="var(--muted)" class="mono r1">sense signals · frame context · validate decisions · serve people · learn from reality</text><line class="wire" x1="500" y1="126" x2="500" y2="590"/><line class="wire" x1="160" y1="198" x2="840" y2="198"/><line class="wire" x1="160" y1="338" x2="840" y2="338"/><line class="wire" x1="160" y1="478" x2="840" y2="478"/><rect class="rise r1" x="80" y="156" width="240" height="70" fill="var(--node)" stroke="var(--rule)"/><text x="98" y="184" font-size="13" fill="var(--bone)" font-weight="700" letter-spacing="1" class="mono r1">SIGNAL</text><text x="98" y="207" font-size="11" fill="var(--muted)" class="mono r1">cameras · sensors</text><rect class="rise r2" x="380" y="156" width="240" height="70" fill="var(--node)" stroke="var(--rule)"/><text x="398" y="184" font-size="13" fill="var(--bone)" font-weight="700" letter-spacing="1" class="mono r2">CONTEXT</text><text x="398" y="207" font-size="11" fill="var(--muted)" class="mono r2">DOM · telemetry</text><rect class="rise r3" x="680" y="156" width="240" height="70" fill="var(--node)" stroke="var(--rule)"/><text x="698" y="184" font-size="13" fill="var(--bone)" font-weight="700" letter-spacing="1" class="mono r3">DATA</text><text x="698" y="207" font-size="11" fill="var(--muted)" class="mono r3">datasets · evidence</text><rect class="rise r4" x="80" y="296" width="240" height="70" fill="var(--node)" stroke="var(--rule)"/><text x="98" y="324" font-size="13" fill="var(--bone)" font-weight="700" letter-spacing="1" class="mono r4">INFER</text><text x="98" y="347" font-size="11" fill="var(--muted)" class="mono r4">ML · vision · LLM</text><rect class="rise r5" x="380" y="296" width="240" height="70" fill="var(--node)" stroke="var(--rule)"/><text x="398" y="324" font-size="13" fill="var(--bone)" font-weight="700" letter-spacing="1" class="mono r5">GROUND</text><text x="398" y="347" font-size="11" fill="var(--muted)" class="mono r5">retrieval · rules</text><rect class="rise r6" x="680" y="296" width="240" height="70" fill="var(--node)" stroke="var(--rule)"/><text x="698" y="324" font-size="13" fill="var(--bone)" font-weight="700" letter-spacing="1" class="mono r6">EXPLAIN</text><text x="698" y="347" font-size="11" fill="var(--muted)" class="mono r6">metrics · traces</text><rect class="rise r7" x="80" y="436" width="240" height="70" fill="var(--node)" stroke="var(--rule)"/><text x="98" y="464" font-size="13" fill="var(--bone)" font-weight="700" letter-spacing="1" class="mono r7">SERVE</text><text x="98" y="487" font-size="11" fill="var(--muted)" class="mono r7">FastAPI · APIs</text><rect class="rise r8" x="380" y="436" width="240" height="70" fill="var(--node)" stroke="var(--rule)"/><text x="398" y="464" font-size="13" fill="var(--bone)" font-weight="700" letter-spacing="1" class="mono r8">SHIP</text><text x="398" y="487" font-size="11" fill="var(--muted)" class="mono r8">React · MV3 · Docker</text><rect class="rise r9" x="680" y="436" width="240" height="70" fill="var(--node)" stroke="var(--rule)"/><text x="698" y="464" font-size="13" fill="var(--bone)" font-weight="700" letter-spacing="1" class="mono r9">DEVICE</text><text x="698" y="487" font-size="11" fill="var(--muted)" class="mono r9">ESP32 · IoT</text><rect x="370" y="516" width="260" height="48" fill="var(--core)" stroke="var(--accent)"/><circle class="ring" style="transform-origin:500px 540px" cx="500" cy="540" r="18" stroke="var(--accent)" fill="none"/><circle class="pulse" cx="500" cy="540" r="5" fill="var(--accent)"/><text x="500" y="538" font-size="12" fill="var(--bone)" font-weight="700" text-anchor="middle" letter-spacing="2" class="mono r10">PRACTICAL SYSTEMS</text><text x="500" y="592" font-size="11" fill="var(--accent)" text-anchor="middle" letter-spacing="2" class="mono r10">BUILD → TEST → EXPLAIN → SHIP → OBSERVE</text></g>
</svg>