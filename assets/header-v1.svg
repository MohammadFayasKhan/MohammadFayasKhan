<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mohammad Fayas Khan — CSE student and applied AI builder">
<style>
:root{--bone:#444444;--muted:#888888;--dim:#AAAAAA;--rule:#C0C0C0;--accent:#555555;--node:#F0F0F0;--core:#E8E8E8}
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:var(--node);stroke:var(--rule);stroke-width:1}
.soft{fill:var(--core);stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule);stroke-width:1;opacity:.32}
.bar{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)}
.rise{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.1s}.r2{animation-delay:.2s}.r3{animation-delay:.3s}.r4{animation-delay:.4s}.r5{animation-delay:.5s}.r6{animation-delay:.6s}.r7{animation-delay:.7s}.r8{animation-delay:.8s}.r9{animation-delay:.9s}.r10{animation-delay:1s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.wire{stroke:var(--rule);stroke-width:1;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-origin:60px 64px}
.blink{animation:blink 1.1s steps(2,end) infinite}
.scan{animation:scan 4s ease-in-out infinite}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:.15}50%{opacity:.8}100%{transform:translateX(900px);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.rise,.draw,.wire,.pulse,.ring,.blink,.scan,.float{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<title>Mohammad Fayas Khan — CSE student and applied AI builder</title>
<g><rect class="soft" x="28" y="20" width="944" height="372" rx="4"/><text x="48" y="44" font-size="11" fill="var(--muted)" letter-spacing="3" class="mono">PORTFOLIO — INDEX Nº 001</text><text x="952" y="44" font-size="11" fill="var(--muted)" text-anchor="end" letter-spacing="3" class="mono">PHAGWARA, IN — 31.25° N</text><line class="scan" x1="48" y1="76" x2="48" y2="330" stroke="var(--accent)" stroke-width="1"/><text x="46" y="176" font-size="62" fill="var(--bone)" font-weight="700" letter-spacing="-2" textLength="900" lengthAdjust="spacingAndGlyphs" class="mono rise r1">Mohammad Fayas Khan</text><rect class="blink" x="952" y="130" width="7" height="46" fill="var(--accent)"/><text x="48" y="214" font-size="19" fill="var(--muted)" class="mono rise r2">CSE Student &amp; Applied AI Builder — Phagwara, India.</text><text x="48" y="274" font-size="12" fill="var(--dim)" letter-spacing="1" class="mono rise r3">focus  ▸</text><text x="128" y="274" font-size="12" fill="var(--accent)" letter-spacing="1" class="mono rise r3">AI/ML · computer vision · LLM systems · backend · IoT</text><text x="48" y="300" font-size="12" fill="var(--dim)" letter-spacing="1" class="mono rise r4">building practical systems with software, models, automation and hardware</text><line class="draw" x1="48" y1="342" x2="952" y2="342"/><text x="48" y="374" font-size="11" fill="var(--muted)" letter-spacing="3" class="mono rise r5">B.TECH CSE @ LPU · GRADUATING 2028</text><text x="952" y="374" font-size="11" fill="var(--muted)" text-anchor="end" letter-spacing="2" class="mono rise r5">TEAM INNOVEX · OPEN TO COLLABORATION</text></g>
</svg>