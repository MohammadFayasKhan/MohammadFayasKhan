<svg viewBox="0 0 1000 238" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical stack — languages, AI, web, IoT and tooling">
<style>
:root{--bone:#444444;--muted:#888888;--dim:#AAAAAA;--rule:#C0C0C0;--accent:#555555;--node:#F0F0F0;--core:#E8E8E8}
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:var(--node);stroke:var(--rule);stroke-width:1}
.soft{fill:var(--core);stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule);stroke-width:1;opacity:.32}
.bar{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)}
.rise{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.1s}.r2{animation-delay:.2s}.r3{animation-delay:.3s}.r4{animation-delay:.4s}.r5{animation-delay:.5s}.r6{animation-delay:.6s}.r7{animation-delay:.7s}.r8{animation-delay:.8s}.r9{animation-delay:.9s}.r10{animation-delay:1s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.wire{stroke:var(--rule);stroke-width:1;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-origin:60px 64px}
.blink{animation:blink 1.1s steps(2,end) infinite}
.scan{animation:scan 4s ease-in-out infinite}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:.15}50%{opacity:.8}100%{transform:translateX(900px);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.rise,.draw,.wire,.pulse,.ring,.blink,.scan,.float{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<title>Technical stack — languages, AI, web, IoT and tooling</title>
<g><line x1="138" y1="8" x2="138" y2="230" stroke="var(--rule)" opacity=".4"/><text x="48" y="32" font-size="12" fill="var(--muted)" letter-spacing="2" class="mono r1">LANGUAGES</text><text x="154" y="32" font-size="15" fill="var(--bone)" class="mono r1">C · C++ · Python · Java · JavaScript</text><text x="48" y="64" font-size="12" fill="var(--muted)" letter-spacing="2" class="mono r2">AI / ML</text><text x="154" y="64" font-size="15" fill="var(--bone)" class="mono r2">machine learning · deep learning · computer vision · NLP</text><text x="48" y="96" font-size="12" fill="var(--muted)" letter-spacing="2" class="mono r3">LLM</text><text x="154" y="96" font-size="15" fill="var(--bone)" class="mono r3">Transformers · RAG · embeddings · prompt engineering · agents</text><text x="48" y="128" font-size="12" fill="var(--muted)" letter-spacing="2" class="mono r4">WEB</text><text x="154" y="128" font-size="15" fill="var(--bone)" class="mono r4">FastAPI · Django · Node.js · React · REST APIs</text><text x="48" y="160" font-size="12" fill="var(--muted)" letter-spacing="2" class="mono r5">IOT</text><text x="154" y="160" font-size="15" fill="var(--bone)" class="mono r5">ESP32 · ESP8266 · Arduino · Raspberry Pi · RFID · sensors</text><text x="48" y="192" font-size="12" fill="var(--muted)" letter-spacing="2" class="mono r6">TOOLING</text><text x="154" y="192" font-size="15" fill="var(--bone)" class="mono r6">Git · Docker · Postman · Kaggle · Hugging Face · Jupyter</text><text x="48" y="224" font-size="12" fill="var(--muted)" letter-spacing="2" class="mono r7">METHOD</text><text x="154" y="224" font-size="15" fill="var(--accent)" class="mono r7">measure honestly · validate outputs · ship useful interfaces</text></g>
</svg>