<svg viewBox="0 0 1000 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Credentials, leadership, and academic record">
  <style>:root{--bone:#444;--muted:#888;--rule:#c0c0c0;--accent:#555;--panel:#fff}@media(prefers-color-scheme:dark){:root{--bone:#ddd;--muted:#888;--rule:#444;--accent:#aaa;--panel:#111}}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.rise{opacity:0;animation:rise .6s ease forwards}.a1{animation-delay:.15s}.a2{animation-delay:.3s}.a3{animation-delay:.45s}.a4{animation-delay:.6s}.a5{animation-delay:.75s}@keyframes rise{to{opacity:1}}@media(prefers-reduced-motion:reduce){.rise{animation:none;opacity:1}}</style>
  <rect width="1000" height="430" fill="var(--panel)" stroke="var(--rule)"/>
  <text class="mono" x="48" y="34" font-size="11" letter-spacing="3.5" fill="var(--muted)">CREDENTIALS · LEADERSHIP · ACADEMIC RECORD</text>
  <line x1="48" y1="52" x2="952" y2="52" stroke="var(--rule)"/>
  <g class="mono rise a1" fill="var(--bone)" font-size="12"><text x="48" y="86">JUN–JUL 2026</text><text x="260" y="86" fill="var(--muted)">LPU AI ENGINEER LAUNCHPAD · 50 HOURS</text><text x="260" y="106" fill="var(--muted)">LLMS · RAG · TOOL CALLING · LORA/QLORA · FASTAPI · GUARDRAILS</text></g>
  <g class="mono rise a2" fill="var(--bone)" font-size="12"><text x="48" y="146">SEP 2026</text><text x="260" y="146" fill="var(--muted)">TEAM INNOVEX LEADER · GEARUP SEASON 5</text><text x="260" y="166" fill="var(--muted)">TOP 30 HARDWARE TEAMS OUT OF 900+</text></g>
  <g class="mono rise a3" fill="var(--bone)" font-size="12"><text x="48" y="206">2025–2026</text><text x="260" y="206" fill="var(--muted)">ORACLE · NASSCOM · INFOSYS · GOOGLE · N8N CERTIFICATIONS</text><text x="260" y="226" fill="var(--muted)">AI FOUNDATIONS · ML/IMAGE PROCESSING · C++ · ANALYTICS</text></g>
  <line x1="48" y1="250" x2="952" y2="250" stroke="var(--rule)"/>
  <text class="mono" x="48" y="278" font-size="11" fill="var(--muted)">TERM</text><text class="mono" x="190" y="278" font-size="11" fill="var(--muted)">TGPA</text><text class="mono" x="300" y="278" font-size="11" fill="var(--muted)">CORE SUBJECTS</text>
  <g class="mono rise a4" font-size="12" fill="var(--bone)"><text x="48" y="306">SEM 1</text><text x="190" y="306">9.55</text><text x="300" y="306" fill="var(--muted)">PYTHON · COMPUTING · ENGINEERING MATHEMATICS</text><text x="48" y="334">SEM 2</text><text x="190" y="334">9.63</text><text x="300" y="334" fill="var(--muted)">DBMS · SOFTWARE ENGINEERING · DISCRETE MATHEMATICS</text><text x="48" y="362">SEM 3</text><text x="190" y="362">9.76</text><text x="300" y="362" fill="var(--muted)">OOP · DSA · NETWORKS · PROBABILITY AND STATISTICS</text><text x="48" y="390">SEM 4</text><text x="190" y="390">9.72</text><text x="300" y="390" fill="var(--muted)">OS · DAA · THEORY OF COMPUTATION · COMPUTER ORGANIZATION</text></g>
  <text class="mono rise a5" x="760" y="418" font-size="13" fill="var(--accent)">OVERALL CGPA 9.66</text>
</svg>
