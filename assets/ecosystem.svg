<svg viewBox="0 0 1000 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"><style>
:root { --bone:#444; --muted:#888; --dim:#aaa; --rule:#c0c0c0; --accent:#555; --node:#fff; }
@media (prefers-color-scheme:dark) { :root { --bone:#ddd; --muted:#777; --dim:#666; --rule:#444; --accent:#aaa; --node:#111; } }
.mono { font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; }
.node { fill:var(--node); stroke:var(--rule); }
.line { stroke:var(--rule); stroke-width:1.5; stroke-dasharray:6 6; }
.pop { opacity:0; animation:pop .7s ease forwards; }
@keyframes pop { to { opacity:1; } }
.p1{animation-delay:.15s}.p2{animation-delay:.3s}.p3{animation-delay:.45s}.p4{animation-delay:.6s}.p5{animation-delay:.75s}.p6{animation-delay:.9s}.p7{animation-delay:1.05s}.p8{animation-delay:1.2s}.p9{animation-delay:1.35s}.p10{animation-delay:1.5s}
.flow { stroke-dasharray:8 8; animation:flow 1.8s linear infinite; }
@keyframes flow { to { stroke-dashoffset:-32; } }
@media (prefers-reduced-motion:reduce) { .pop,.flow { animation:none; opacity:1; } }
</style><text class="mono" x="48" y="28" font-size="11" letter-spacing="3.5" fill="var(--muted)">SYSTEM FLOW — FROM SIGNAL TO SHIPPED PRODUCT</text><text class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end" fill="var(--muted)">FIG. 01</text>
