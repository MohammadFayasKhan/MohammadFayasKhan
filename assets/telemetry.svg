<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub development telemetry">
<style>
:root{--bone:#444444;--muted:#888888;--dim:#AAAAAA;--rule:#C0C0C0;--accent:#555555;--node:#F0F0F0;--core:#E8E8E8}
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:var(--node);stroke:var(--rule);stroke-width:1}
.soft{fill:var(--core);stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule);stroke-width:1;opacity:.32}
.bar{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--accent)}
.rise{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.1s}.r2{animation-delay:.2s}.r3{animation-delay:.3s}.r4{animation-delay:.4s}.r5{animation-delay:.5s}.r6{animation-delay:.6s}.r7{animation-delay:.7s}.r8{animation-delay:.8s}.r9{animation-delay:.9s}.r10{animation-delay:1s}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.wire{stroke:var(--rule);stroke-width:1;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-origin:60px 64px}
.blink{animation:blink 1.1s steps(2,end) infinite}
.scan{animation:scan 4s ease-in-out infinite}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:.15}50%{opacity:.8}100%{transform:translateX(900px);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.rise,.draw,.wire,.pulse,.ring,.blink,.scan,.float{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<title>GitHub development telemetry</title>
<g><text x="48" y="34" font-size="11" fill="var(--muted)" letter-spacing="3" class="mono">TELEMETRY</text><text x="952" y="34" font-size="11" fill="var(--accent)" text-anchor="end" letter-spacing="1" class="mono">WHAT THE ACCOUNT SHOWS</text><line class="draw" x1="48" y1="52" x2="952" y2="52"/><text x="48" y="82" font-size="11" fill="var(--muted)" letter-spacing="2" class="mono r1">REPOSITORY SIGNALS</text><text x="48" y="108" font-size="14" fill="var(--bone)" font-weight="700" class="mono r1">LANGUAGES / ACTIVITY / LEARNING</text><text x="48" y="140" font-size="11" fill="var(--bone)" class="mono r1">PYTHON + NOTEBOOKS</text><line class="rise r1" x1="250" y1="136" x2="480" y2="136" stroke="var(--rule)"/><circle class="rise r1" cx="312" cy="136" r="3" fill="var(--accent)"/><text x="48" y="169" font-size="11" fill="var(--bone)" class="mono r2">JAVASCRIPT + TYPESCRIPT</text><line class="rise r2" x1="250" y1="165" x2="480" y2="165" stroke="var(--rule)"/><circle class="rise r2" cx="354" cy="165" r="3" fill="var(--accent)"/><text x="48" y="198" font-size="11" fill="var(--bone)" class="mono r3">C + C++ + EMBEDDED</text><line class="rise r3" x1="250" y1="194" x2="480" y2="194" stroke="var(--rule)"/><circle class="rise r3" cx="396" cy="194" r="3" fill="var(--accent)"/><text x="48" y="227" font-size="11" fill="var(--bone)" class="mono r4">HTML + CSS + OTHER</text><line class="rise r4" x1="250" y1="223" x2="480" y2="223" stroke="var(--rule)"/><circle class="rise r4" cx="438" cy="223" r="3" fill="var(--accent)"/><text x="570" y="82" font-size="11" fill="var(--muted)" letter-spacing="2" class="mono r5">ACTIVITY</text><text x="570" y="108" font-size="14" fill="var(--bone)" font-weight="700" class="mono r5">CONTRIBUTION TELEMETRY</text><polyline class="draw" points="570,220 620,190 670,204 720,150 770,178 820,122 870,145 920,96" fill="none" stroke="var(--accent)" stroke-width="2"/><circle class="pulse" cx="570" cy="220" r="3" fill="var(--accent)"/><circle class="pulse" cx="620" cy="190" r="3" fill="var(--accent)"/><circle class="pulse" cx="670" cy="204" r="3" fill="var(--accent)"/><circle class="pulse" cx="720" cy="150" r="3" fill="var(--accent)"/><circle class="pulse" cx="770" cy="178" r="3" fill="var(--accent)"/><circle class="pulse" cx="820" cy="122" r="3" fill="var(--accent)"/><circle class="pulse" cx="870" cy="145" r="3" fill="var(--accent)"/><circle class="pulse" cx="920" cy="96" r="3" fill="var(--accent)"/><text x="570" y="250" font-size="11" fill="var(--muted)" class="mono r9">LIVE CONTRIBUTION GRAPH RENDERED BELOW</text><text x="48" y="270" font-size="10" fill="var(--accent)" letter-spacing="1" class="mono r10">No hardcoded percentages, streaks, stars or solve counts.</text></g>
</svg>